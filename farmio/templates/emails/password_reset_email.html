{% load i18n %}
<!DOCTYPE html>
<html lang="fr"><body style="font-family:Arial,sans-serif;background:#f6f7f6;padding:24px;">
  <table style="max-width:480px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;">
    <tr><td style="background:#166534;padding:20px;text-align:center;">
      <span style="color:#fff;font-size:20px;font-weight:bold;">{{ site_name }}</span></td></tr>
    <tr><td style="padding:32px;">
      <p>{% blocktrans %}Bonjour {{ full_name }},{% endblocktrans %}</p>
      <p>{% trans "Vous avez demandé la réinitialisation de votre mot de passe :" %}</p>
      <p style="text-align:center;margin:24px 0;">
        <a href="{{ reset_url }}" style="background:#166534;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;">{% trans "Réinitialiser mon mot de passe" %}</a>
      </p>
    </td></tr>
  </table>
</body></html>
