<div id="{{ modal_id|default:'global-modal' }}" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/40 px-4" aria-hidden="true">
  <div class="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-6 shadow-2xl">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-emerald-700">{{ eyebrow|default:'Information' }}</p>
        <h3 class="mt-2 text-xl font-bold text-slate-900">{{ title|default:'Modal' }}</h3>
      </div>
      <button type="button" class="modal-close inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-slate-500 transition hover:border-slate-300 hover:text-slate-700" aria-label="Fermer la fenêtre">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="mt-5 text-sm leading-6 text-slate-600">
      {{ content|default:'Contenu' }}
    </div>
    {% if action_label %}
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" class="btn-secondary modal-close">Annuler</button>
        <button type="button" class="btn-primary">{{ action_label }}</button>
      </div>
    {% endif %}
  </div>
</div>
