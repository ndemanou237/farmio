{% load i18n %}
<nav class="border-b border-slate-200 bg-white/90 backdrop-blur-xl">
  <div class="container-shell flex items-center justify-between gap-4 py-3.5">
    <a href="{% url 'home' %}" class="flex items-center gap-3" aria-label="Farmio accueil">
      <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-700 text-white shadow-sm">
        <i class="fa-solid fa-seedling text-sm"></i>
      </div>
      <div>
        <span class="block text-lg font-black tracking-tight text-emerald-800">Farmio</span>
      </div>
    </a>

    <div class="flex items-center gap-3 text-sm font-medium">
      {% if user.is_authenticated %}
        <span class="hidden rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs text-slate-600 sm:inline-flex">
          {{ request.user.get_full_name|default:request.user.email }}
        </span>
        <a href="{% url 'users:profile-detail' %}" class="nav-link">{% trans "Mon profil" %}</a>
        <a href="{% url 'users:logout' %}" class="btn-secondary px-3 py-2">{% trans "Déconnexion" %}</a>
      {% else %}
        <a href="{% url 'users:login' %}" class="nav-link">{% trans "Connexion" %}</a>
        <a href="{% url 'users:signup' %}" class="btn-primary px-4 py-2.5">{% trans "Inscription" %}</a>
      {% endif %}
    </div>
  </div>
</nav>
