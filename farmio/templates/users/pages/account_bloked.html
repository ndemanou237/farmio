{% extends "users/base.html" %}
{% load i18n %}
{% block title %}{% trans "Accès restreint" %} — Farmio{% endblock %}
{% block users_content %}
<div class="max-w-lg mx-auto px-4 py-20 text-center">
  <div class="text-5xl mb-4">🚫</div>
  <h1 class="text-2xl font-bold mb-2">{% trans "Votre compte a été suspendu" %}</h1>
  <p class="text-gray-500 mb-6">{% trans "Contactez le support pour plus d'informations." %}</p>
  <form method="post" action="{% url 'users:logout' %}">
    {% csrf_token %}
    <button type="submit" class="text-green-700 font-medium hover:underline">{% trans "Se déconnecter" %}</button>
  </form>
</div>
{% endblock %}
